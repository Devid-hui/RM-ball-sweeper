# 来源：ROCK4D_OpenRF1_通信配置指南_20261122 的 verified_configuration.json。
transport: uart
controller: OpenRF1
rock_overlay: UART4-M1
device: /dev/ttyS4
openrf1_uart: USART2
baud_rate: 115200
data_bits: 8
parity: none
stop_bits: 1
flow_control: none

# 已验证基本串口往返。速度指令、轮端反馈和断联停车协议待定义。
protocol: openrf1_uart2_echo
